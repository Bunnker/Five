      enum: [codex, relay, external_tool, licensed_upload, owned_upload, fallback_template]
    ImageSourceAndGenerationMetadata:
      description: |
        来源类型与生成方式必须配对：AI 素材只使用 codex、relay 或 external_tool，并提供完整生成追溯；
        授权或自有上传只使用 licensed_upload 或 owned_upload；审核降级模板只使用 fallback_template。
      oneOf:
        - type: object
          required:
            - sourceType
            - generationMethod
            - declaredModel
            - promptVersion
            - generatedAt
            - reproductionReference
          properties:
            sourceType:
              type: string
              const: ai_generated
            generationMethod:
              type: string
              enum: [codex, relay, external_tool]
            declaredModel:
              type: string
              minLength: 1
              maxLength: 128

openapi: 3.1.0
info:
  title: Five 网页验证版接口
  version: 1.0.0
  summary: 公开网页、单人后台与后端共同使用的 P0 接口契约
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    本文件是 Five P0 接口字段、状态、错误码和版本保护规则的唯一事实源。
    `contentVersion`、各种 ID 和修订号都是不透明值，调用方不得解析其字符串。
    P0 只有网页端，因此接口不包含 `platform`、`sourcePlatform` 或 `targetPlatform`。
    `channelId` 只用于区分链接分发来源，不得改变日期、档位、正文或图片。
    所有 `/admin/api/v1` 响应（包括错误）必须使用 `Cache-Control: no-store`，防止退出后从缓存读取后台内容或核对凭证。
servers:
  - url: /
    description: 与网页同源的后端
tags:
  - name: Public content
    description: 匿名用户读取已经发布的内容
  - name: Public sharing
    description: 海报、分享落地和反馈
  - name: Admin authentication
    description: 单一维护者登录、会话与控制权恢复
  - name: Admin security
    description: 安全记录与全局公开内容紧急控制
  - name: Admin drafts
    description: 单一维护者编辑草稿并提交为不可变内容版本
  - name: Admin images
    description: 草稿图片上传、逐图检查与内容版本图片交付
  - name: Admin lifecycle
    description: 大师外部确认、检查、排期、发布、下线与恢复
  - name: Admin audit
    description: 单一维护者查看审计记录
security: []

paths:
  /api/v1/today:
    get:
      operationId: getToday
      tags: [Public content]
      summary: 获取服务端当前命理日的已发布内容
      description: |
        服务端按 `Asia/Shanghai` 一次性计算完整 `requestContext`。
        网页不得使用设备时钟重新计算 `civilDate`、`fortuneDate` 或 `shichen`。
      responses:
        "200":
          description: 当前命理日存在可以公开读取的内容
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Content-Version:
              $ref: "#/components/headers/XContentVersion"
            ETag:
              $ref: "#/components/headers/RepresentationETag"
            Cache-Control:
              $ref: "#/components/headers/DynamicCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayResponse"
              examples:
                woodDay:
                  $ref: "#/components/examples/TodaySuccess"
        "304":
          description: "`If-None-Match` 对应的完整响应表示仍有效"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            ETag:
              $ref: "#/components/headers/RepresentationETag"
            Cache-Control:
              $ref: "#/components/headers/DynamicCacheControl"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/PublicContentUnavailable"

  /api/v1/daily/{fortuneDate}:
    get:
      operationId: getDailyContent
      tags: [Public content]
      summary: 获取指定命理日当前安全的公开内容
      description: |
        用于分享落地页和既有日期链接，不表示产品提供历史浏览入口。
        如果调用方提供的预期版本已经被替换、回滚或下线，服务端返回当前安全版本，
        并在 `resolution` 中说明发生了版本变化。
      parameters:
        - $ref: "#/components/parameters/FortuneDate"
        - $ref: "#/components/parameters/ExpectedContentVersionOptional"
      responses:
        "200":
          description: 返回指定日期当前安全的公开内容
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Content-Version:
              $ref: "#/components/headers/XContentVersion"
            ETag:
              $ref: "#/components/headers/RepresentationETag"
            Cache-Control:
              $ref: "#/components/headers/DynamicCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyContentResponse"
              examples:
                current:
                  $ref: "#/components/examples/DailyCurrentSuccess"
                rolledBack:
                  $ref: "#/components/examples/DailyVersionChangedSuccess"
        "400":
          $ref: "#/components/responses/InvalidFortuneDate"
        "404":
          $ref: "#/components/responses/ContentNotFound"
        "410":
          $ref: "#/components/responses/HistoricalContentExpired"
        "503":
          $ref: "#/components/responses/PublicContentUnavailable"

  /api/v1/daily/{fortuneDate}/looks/{lookId}:
    get:
      operationId: getLookDetail
      tags: [Public content]
      summary: 获取指定内容版本中的穿搭详情
      parameters:
        - $ref: "#/components/parameters/FortuneDate"
        - $ref: "#/components/parameters/LookId"
        - $ref: "#/components/parameters/ExpectedContentVersionRequired"
      responses:
        "200":
          description: 返回与预期内容版本一致的穿搭详情
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Content-Version:
              $ref: "#/components/headers/XContentVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookDetailResponse"
              examples:
                commute:
                  $ref: "#/components/examples/LookDetailSuccess"
        "400":
          $ref: "#/components/responses/InvalidFortuneDate"
        "404":
          $ref: "#/components/responses/LookNotFound"
        "409":
          $ref: "#/components/responses/ContentVersionChanged"
        "503":
          $ref: "#/components/responses/PublicContentUnavailable"

  /api/v1/poster-jobs:
    post:
      operationId: createPosterJob
      tags: [Public sharing]
      summary: 获取已有海报或创建海报渲染任务
      description: |
        海报只使用已经发布的内容、已审核图片和已冻结模板，不调用 AI 生图。
        相同业务意图的网络重试必须复用同一个 `Idempotency-Key`。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePosterJobRequest"
            examples:
              organic:
                value:
                  fortuneDate: "2026-07-15"
                  expectedContentVersion: fd-20260715-r3
                  channelId: organic
      responses:
        "200":
          description: 已有相同海报实例
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosterJob"
        "202":
          description: 已接受新的渲染任务
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosterJob"
              examples:
                processing:
                  $ref: "#/components/examples/PosterJobProcessing"
        "409":
          description: 内容版本已变化或幂等键被用于另一请求
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/PosterUnavailable"

  /api/v1/poster-jobs/{jobId}:
    get:
      operationId: getPosterJob
      tags: [Public sharing]
      summary: 查询海报任务状态
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 返回当前任务状态
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosterJob"
              examples:
                ready:
                  $ref: "#/components/examples/PosterJobReady"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "503":
          $ref: "#/components/responses/PosterUnavailable"

  /api/v1/feedback-reports:
    post:
      operationId: createFeedbackReport
      tags: [Public sharing]
      summary: 提交内容纠错或产品建议
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackRequest"
            examples:
              contentError:
                value:
                  category: content_error
                  message: 图片主色与文字配方不一致
                  fortuneDate: "2026-07-15"
                  contentVersion: fd-20260715-r3
                  channelId: organic
                  contact: null
      responses:
        "202":
          description: 已接收反馈
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFeedbackResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/FeedbackUnavailable"

  /admin/api/v1/auth/password-challenges:
    post:
      operationId: createAdminPasswordChallenge
      tags: [Admin authentication]
      summary: 校验单一维护者账号与密码并创建一次性 TOTP 挑战
      description: |
        无论账号是否存在，失败时都执行等价密码哈希校验并返回同一错误。
        请求在解析正文前先接受持久化的请求来源级限流；严格解析并规范化账号后、
        执行昂贵密码哈希前，再接受持久化的账号级限流。
        虽然此阶段尚无会话 CSRF 令牌，请求仍必须携带并通过可信同源 `Origin` 校验。
        挑战只能使用一次，并在五分钟后失效。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePasswordChallengeRequest"
      responses:
        "200":
          description: 密码已校验，等待验证器动态码
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChallenge"
        "400":
          $ref: "#/components/responses/AuthInvalidArgument"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfValidationFailed"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "503":
          $ref: "#/components/responses/AdminServiceUnavailable"

  /admin/api/v1/auth/sessions:
    post:
      operationId: createAdminSession
      tags: [Admin authentication]
      summary: 使用密码挑战与 TOTP 动态码建立后台会话
      description: |
        服务端在 PostgreSQL 中原子消费一次性密码挑战和 TOTP counter；允许的时钟偏差内，
        已用于登录或其他高风险动作的同一 counter 也不能再次使用。成功后只通过同源
        `HttpOnly`、`Secure`、`SameSite=Strict`、`Path=/admin` 且无 `Domain` 的 Cookie
        返回随机会话令牌，响应正文只返回与该会话绑定的 CSRF 令牌和会话期限。此请求在
        会话建立前没有 CSRF 令牌，但仍必须通过可信同源 `Origin` 校验。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminSessionRequest"
      responses:
        "201":
          description: 已建立 30 分钟闲置、12 小时绝对上限的后台会话
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
            Set-Cookie:
              $ref: "#/components/headers/AdminSessionSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          $ref: "#/components/responses/AuthInvalidArgument"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfValidationFailed"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "503":
          $ref: "#/components/responses/AdminServiceUnavailable"

  /admin/api/v1/auth/session:
    get:
      operationId: getAdminSession
      tags: [Admin authentication]
      summary: 查看当前后台会话及 CSRF 令牌
      security:
        - AdminSession: []
      responses:
        "200":
          description: 当前会话有效；访问会刷新闲置期限，但不能延长绝对期限
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/AdminServiceUnavailable"
    delete:
      operationId: deleteAdminSession
      tags: [Admin authentication]
      summary: 安全退出当前后台会话
      description: 必须同时通过可信同源 `Origin` 与会话绑定的 CSRF 令牌校验。
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/XCsrfToken"
      responses:
        "204":
          description: 当前会话已注销；响应同时清除浏览器 Cookie
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
            Set-Cookie:
              $ref: "#/components/headers/AdminSessionClearedCookie"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfValidationFailed"
        "503":
          $ref: "#/components/responses/AdminServiceUnavailable"

  /admin/api/v1/auth/logout-all:
    post:
      operationId: logoutAllAdminSessions
      tags: [Admin authentication]
      summary: 原子注销单一维护者的全部后台会话
      description: |
        必须同时通过可信同源 `Origin` 与会话绑定的 CSRF 令牌校验。成功后原子撤销
        全部现有会话并作废尚未消费的登录挑战，不能由操作前签发的挑战重新建立会话。
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/XCsrfToken"
      responses:
        "204":
          description: 全部会话已注销；当前浏览器 Cookie 同时清除
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
            Set-Cookie:
              $ref: "#/components/headers/AdminSessionClearedCookie"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfValidationFailed"
        "503":
          $ref: "#/components/responses/AdminServiceUnavailable"

  /admin/api/v1/auth/recovery-challenges:
    post:
      operationId: createAdminRecoveryChallenge
      tags: [Admin authentication]
      summary: 原子消费一个恢复码并开始两阶段控制权恢复
      description: |
        正确恢复码在 PostgreSQL 中只消费一次，并立即提升凭据修订号、注销全部会话、
        使旧验证器和全部旧恢复码失效。随后只签发十分钟有效、一次性的恢复挑战，
        同时给出待启用的新 TOTP 配置。失败不暴露账号或恢复码是否存在；请求来源在正文解析前
        限流，账号在严格解析并规范化后、校验恢复码前限流。此未登录请求仍必须通过可信同源
        `Origin` 校验。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecoveryChallengeRequest"
      responses:
        "200":
          description: 恢复码已消费，等待设置新密码并验证新的 TOTP
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryChallenge"
        "400":
          $ref: "#/components/responses/AuthInvalidArgument"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfValidationFailed"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "503":
          $ref: "#/components/responses/AdminServiceUnavailable"

  /admin/api/v1/auth/recovery-completions:
    post:
      operationId: completeAdminRecovery
      tags: [Admin authentication]
      summary: 完成新密码与新验证器设置并签发新的恢复码
      description: |
        原子消费十分钟恢复挑战并校验待启用 TOTP 的未使用 counter。成功后启用新凭据，
        一次性返回恰好十个新恢复码并建立新会话；服务端只保存恢复码摘要。此请求在新会话
        建立前没有 CSRF 令牌，但仍必须通过可信同源 `Origin` 校验。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRecoveryRequest"
      responses:
        "201":
          description: 已恢复控制权；新的恢复码只在本响应显示一次
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
            Set-Cookie:
              $ref: "#/components/headers/AdminSessionSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCompletion"
        "400":
          $ref: "#/components/responses/AuthInvalidArgument"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfValidationFailed"
        "409":
          $ref: "#/components/responses/AuthConflict"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "503":
          $ref: "#/components/responses/AdminServiceUnavailable"

  /admin/api/v1/security-events:
    get:
      operationId: listSecurityEvents
      tags: [Admin security]
      summary: 查询至少保留 365 天的关键登录与安全记录
      description: |
        只返回单向来源指纹和受限浏览器摘要，不返回 IP、密码、动态码、恢复码、挑战或会话原文。
      security:
        - AdminSession: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: 按发生时间倒序返回安全记录
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventPage"
        "400":
          $ref: "#/components/responses/AuthInvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/AdminServiceUnavailable"

  /admin/api/v1/emergency-control:
    get:
      operationId: getEmergencyControlStatus
      tags: [Admin security]
      summary: 查看全局公开内容开关及其修订号
      security:
        - AdminSession: []
      responses:
        "200":
          description: 返回当前公开状态
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
            ETag:
              $ref: "#/components/headers/EmergencyControlETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyControlStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/AdminServiceUnavailable"

  /admin/api/v1/emergency-control/stop:
    post:
      operationId: stopPublicAccess
      tags: [Admin security]
      summary: 紧急停止全部公开内容
      description: |
        必须重新校验当前 TOTP、精确短语“停止全部公开内容”和原因，并原子消费 TOTP counter。
        成功后源站立即 fail closed；已经下载或被外部转发的副本无法召回，正式 CDN 的
        `purge/deny` 联动由 Issue #34 在真实部署环境验收。
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/XCsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyStopRequest"
      responses:
        "200":
          $ref: "#/components/responses/EmergencyControlSucceeded"
        "400":
          $ref: "#/components/responses/AuthInvalidArgument"
        "401":
          $ref: "#/components/responses/AdminReauthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfValidationFailed"
        "409":
          $ref: "#/components/responses/AuthConflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/AdminServiceUnavailable"

  /admin/api/v1/emergency-control/resume:
    post:
      operationId: resumePublicAccess
      tags: [Admin security]
      summary: 恢复全部公开内容
      description: |
        必须重新校验当前 TOTP、精确短语“恢复全部公开内容”和原因，并原子消费 TOTP counter。
        恢复只解除全局开关；每个内容版本仍须独立满足已发布、审核和素材安全条件。
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/XCsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:

        `decision=approved` 时六项检查必须全部为 `passed`，`rightsStatus` 必须为 `cleared`，
        AI 素材的 `aiLabelStatus` 必须为 `complete`；非 AI 素材必须为 `not_applicable`。
    LookDraft:
      type: object
      additionalProperties: false
      allOf:
        - oneOf:
            - type: object
              required: [imageSlot, requiredForPublish, fallbackAssetId]
              properties:
                imageSlot:
                  type: string
                  enum: [required_primary, required_alternative]
                requiredForPublish:
                  type: boolean
                  const: true
                fallbackAssetId:
                  $ref: "#/components/schemas/OpaqueId"
            - type: object
              required: [imageSlot, requiredForPublish, fallbackAssetId]
              properties:
                imageSlot:
                  type: string
                  const: optional
                requiredForPublish:
                  type: boolean
                  const: false
                fallbackAssetId:
                  oneOf:
                    - $ref: "#/components/schemas/OpaqueId"
                    - type: "null"
      required:
        - lookId
        - formulaId
        - imageSlot
        - requiredForPublish
        - sortOrder
        - title
        - scenario
        - audience
        - coverAssetId
        - detailAssetIds
        - fallbackAssetId
        - items
        - alternatives
      properties:
        lookId:
          $ref: "#/components/schemas/OpaqueId"
        formulaId:
          $ref: "#/components/schemas/OpaqueId"
        imageSlot:
          type: string
          enum: [required_primary, required_alternative, optional]
          description: 每日 2+1 只统计封面槽位；细节图和降级素材不计入。
        requiredForPublish:
          type: boolean
          description: 兼容字段；两个 required 槽位必须为 true，optional 必须为 false。
        sortOrder:
          type: integer
          minimum: 1
          maximum: 3
        title:
          type: string
          minLength: 1
          maxLength: 80
        scenario:
          $ref: "#/components/schemas/Scenario"
        audience:
          $ref: "#/components/schemas/Audience"
        coverAssetId:
          $ref: "#/components/schemas/OpaqueId"
        detailAssetIds:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/OpaqueId"
        fallbackAssetId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
          description: |
            同一快照内已经审核通过的降级素材。两个必备槽位必须提供与 coverAssetId 不同、存在于 assets、
            权利和 AI 标识就绪的素材；optional 槽位允许为空，非空时仍需满足相同安全条件。
        items:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/GarmentItem"
        alternatives:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/LookAlternative"
    RightsRecord:
      type: object
      additionalProperties: false
      required: [rightsRecordId, kind, reference, recordedAt]
      properties:
        rightsRecordId:
          $ref: "#/components/schemas/OpaqueId"
        kind:
          type: string
          enum: [license, terms_snapshot, purchase_receipt, consent, internal_record]
        reference:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "\\S"
        recordedAt:
          $ref: "#/components/schemas/ZonedDateTime"
    VisualAndRightsModule:
      type: object
      additionalProperties: false
      required: [looks, assets, rightsRecords, assetManifestVersion]
      properties:
        looks:
          type: array
          minItems: 2
          maxItems: 3
          description: 恰有两个必备槽位和最多一个可选槽位；lookId、sortOrder 与 coverAssetId 分别唯一。
          items:
            $ref: "#/components/schemas/LookDraft"
        assets:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/AdminImageAsset"
        rightsRecords:
          type: array
          items:
            $ref: "#/components/schemas/RightsRecord"
        assetManifestVersion:
          type: string
          minLength: 1
          maxLength: 128
    DraftImageAssetResult:
      type: object
      additionalProperties: false
      required: [draftId, fortuneDate, draftRevision, asset, previewUrl, reviewLocked]
      properties:
        draftId:
          $ref: "#/components/schemas/OpaqueId"
        fortuneDate:
          $ref: "#/components/schemas/FortuneDate"
        draftRevision:
          $ref: "#/components/schemas/DraftRevision"
        asset:
          $ref: "#/components/schemas/AdminImageAsset"
        previewUrl:
          $ref: "#/components/schemas/AdminImagePreviewUrl"
        reviewLocked:
          type: boolean
          description: 为 true 时素材来自已冻结快照，不允许在当前草稿内重新审核；如需调整必须上传新素材。
    AdminImagePreviewUrl:
      type: string
      format: uri-reference
      minLength: 1
      maxLength: 2048
      pattern: "^/admin/api/v1/image-assets/[^/?#]+/preview$"
      description: 精确指向后台素材预览接口的同源相对地址；需要后台会话，不得写入公共内容快照。
    DraftImageCandidate:
      type: object
      additionalProperties: false
      required: [asset, previewUrl, reviewLocked]
      properties:
        asset:
          $ref: "#/components/schemas/AdminImageAsset"
        previewUrl:
          $ref: "#/components/schemas/AdminImagePreviewUrl"
        reviewLocked:
          type: boolean
          description: 为 true 时素材来自已冻结快照，不允许在当前草稿内重新审核；如需调整必须上传新素材。
    DraftImageAssetList:
      type: object
      additionalProperties: false
      required: [draftId, fortuneDate, draftRevision, items]
      properties:
        draftId:
          $ref: "#/components/schemas/OpaqueId"
        fortuneDate:
          $ref: "#/components/schemas/FortuneDate"
        draftRevision:
          $ref: "#/components/schemas/DraftRevision"
        items:
          type: array
          items:
            $ref: "#/components/schemas/DraftImageCandidate"
    ImageAssetDeliveryStatus:
      type: string
      enum: [active, fallback, omitted, unavailable]
    ImageSetSlotDelivery:
      type: object
      additionalProperties: false
      allOf:
        - oneOf:
            - type: object
              required: [imageSlot, fallbackAssetId]
              properties:
                imageSlot:
                  type: string
                  enum: [required_primary, required_alternative]
                fallbackAssetId:
                  $ref: "#/components/schemas/OpaqueId"
            - type: object
              required: [imageSlot, fallbackAssetId]
              properties:
                imageSlot:
                  type: string
                  const: optional
                fallbackAssetId:
                  oneOf:
                    - $ref: "#/components/schemas/OpaqueId"
                    - type: "null"
        - oneOf:
            - type: object
              required: [deliveryStatus, servedCoverAssetId]
              properties:
                deliveryStatus:
                  type: string
                  const: active
                servedCoverAssetId:
                  $ref: "#/components/schemas/OpaqueId"
            - type: object
              required: [deliveryStatus, fallbackAssetId, servedCoverAssetId]
              properties:
                deliveryStatus:
                  type: string
                  const: fallback
                fallbackAssetId:
                  $ref: "#/components/schemas/OpaqueId"
                servedCoverAssetId:
                  $ref: "#/components/schemas/OpaqueId"
            - type: object
              required: [imageSlot, deliveryStatus, servedCoverAssetId]
              properties:
                imageSlot:
                  type: string
                  const: optional
                deliveryStatus:
                  type: string
                  const: omitted
                servedCoverAssetId:
                  type: "null"
            - type: object
              required: [imageSlot, deliveryStatus, servedCoverAssetId]
              properties:
                imageSlot:
                  type: string
                  enum: [required_primary, required_alternative]
                deliveryStatus:
                  type: string
                  const: unavailable
                servedCoverAssetId:
                  type: "null"
      required:
        - imageSlot
        - lookId
        - coverAssetId
        - detailAssetIds
        - fallbackAssetId
        - servedCoverAssetId
        - servedDetailAssetIds
        - deliveryStatus
      properties:
        imageSlot:
          type: string
          enum: [required_primary, required_alternative, optional]
        lookId:
          $ref: "#/components/schemas/OpaqueId"
        coverAssetId:
          $ref: "#/components/schemas/OpaqueId"
        detailAssetIds:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/OpaqueId"
        fallbackAssetId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
        servedCoverAssetId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
          description: 必备槽位为原封面或同快照降级素材；可选槽位下线时为空。
        servedDetailAssetIds:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/OpaqueId"
        deliveryStatus:
          $ref: "#/components/schemas/ImageAssetDeliveryStatus"
      description: |
        所有 cover、detail、fallback 与 served 引用都必须存在于同一 AdminDailyImageSet.assets，且 ID 唯一。
        active 时 coverAssetId 可交付且未下线，servedCoverAssetId 等于它；fallback 时原封面初始不可交付
        或后来下线，servedCoverAssetId 等于可交付且未下线的 fallbackAssetId；仅原封面初始不可交付或后来
        下线的 optional 可 omitted。非活跃版本的必备原图和降级图均已全局下线时可 unavailable，
        servedCoverAssetId 必须为空；活跃版本不得进入该状态。servedDetailAssetIds 必须恰好等于
        detailAssetIds 中可交付且未下线的集合。

  responses:
    InvalidArgument:
      description: 请求字段或格式无效
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidFortuneDate:
      description: 命理日格式或允许范围无效
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: 后台会话不存在或已失效
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: 幂等键、活跃版本或状态发生冲突
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ContentNotFound:
      description: 指定命理日没有可公开内容
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LookNotFound:
      description: 搭配不存在于当前内容版本
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ResourceNotFound:
      description: 后台资源或任务不存在
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ContentVersionChanged:
      description: 网页持有的内容版本不是当前活跃版本
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Content-Version:
          $ref: "#/components/headers/XContentVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            changed:
              $ref: "#/components/examples/ContentVersionChangedError"
    InvalidStateTransition:
      description: 当前状态不允许执行该动作
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    HistoricalContentExpired:
      description: 指定日期的公开内容超过保留期
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RevisionMismatch:
      description: "`If-Match` 不是资源当前修订号"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        ETag:
          description: 当前资源 ETag，调用方必须刷新后再操作。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            stale:
              $ref: "#/components/examples/RevisionMismatchError"
    ReviewMissing:
      description: 大师依据或必审检查不完整
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PublishPrecheckFailed:
      description: 发布、排期或恢复检查未通过
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PreconditionRequired:
      description: 需要并发保护的写操作缺少 `If-Match`
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: 请求过于频繁
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ContentNotReady:
      description: 当前命理日还没有可公开内容
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PosterUnavailable:
      description: 海报暂时不可用，基础每日内容不受影响
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LifecycleActionSucceeded:
      description: 状态变化已在一个事务中完成
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        ETag:
          $ref: "#/components/headers/LifecycleETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LifecycleActionResult"
          examples:
            published:
              $ref: "#/components/examples/LifecycleActionSuccess"


              type: string
              minLength: 1
              maxLength: 128
            generatedAt:
              $ref: "#/components/schemas/ZonedDateTime"
            reproductionReference:
              type: string
              minLength: 1
              maxLength: 500
              pattern: "\\S"
        - type: object
          required: [sourceType, generationMethod]
          properties:
            sourceType:
              type: string
              const: licensed
            generationMethod:
              type: string
              enum: [licensed_upload, owned_upload]
        - type: object
          required: [sourceType, generationMethod]
          properties:
            sourceType:
              type: string
              const: fallback_template
            generationMethod:
              type: string
              const: fallback_template

          $ref: "#/components/schemas/FortuneDate"
        contentVersion:
          $ref: "#/components/schemas/ContentVersion"
        lifecycleRevision:
          $ref: "#/components/schemas/LifecycleRevision"
        slots:
          type: array
          minItems: 2
          maxItems: 3
          description: 恰有一个 required_primary、一个 required_alternative，optional 最多一个；只计封面槽位，lookId 与 coverAssetId 分别唯一。
          items:
            $ref: "#/components/schemas/ImageSetSlotDelivery"
        assets:
          type: array
          minItems: 2
          description: assetId 必须唯一，并覆盖槽位、交付投影与下线事件的所有素材引用。
          items:
            $ref: "#/components/schemas/AdminImageAsset"
        withdrawalEvents:
          type: array
          description: |
            当前 assets 涉及的全局下线事实；旧版本读取时也必须应用其他版本已确认的同一素材下线。
            每个 assetId 只返回最早的有效事件，withdrawalEventId、auditEventId 与 assetId 各自唯一，
            且事件 assetId 必须属于同一 assets。
          items:
            $ref: "#/components/schemas/ImageAssetWithdrawalEvent"

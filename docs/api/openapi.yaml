    CreateFeedbackRequest:
      type: object
      additionalProperties: false
      required:
        - category
        - message
        - fortuneDate
        - contentVersion
        - channelId
        - contact
      properties:
        category:
          type: string
          enum: [content_error, product_feedback]
        message:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '^(?=[\s\S]*\S)[^\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F]*$'
          description: 至少包含一个非空白字符；允许制表符和换行，拒绝其他 C0 与全部 C1 控制字符。
        fortuneDate:
          $ref: "#/components/schemas/FortuneDate"
        contentVersion:
          $ref: "#/components/schemas/ContentVersion"
        channelId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^(?!\s)(?!.*\s$)[^\u0000-\u001F\u007F]+$'
          description: 不透明渠道标识；禁止首尾空白及 C0/DEL 控制字符。
        contact:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 200
              pattern: '^(?=[\s\S]*\S)[^\u0000-\u001F\u007F-\u009F]*$'
              description: 可选联系方式；至少包含一个非空白字符，并拒绝全部 C0/C1 控制字符。
            - type: "null"
          description: 只有用户单独同意后才可填写。

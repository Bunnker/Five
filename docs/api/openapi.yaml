openapi: 3.1.0
info:
  title: Five 网页验证版接口
  version: 1.0.0
  summary: 公开网页、单人后台与后端共同使用的 P0 接口契约
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    本文件是 Five P0 接口字段、状态、错误码和版本保护规则的唯一事实源。
    `contentVersion`、各种 ID 和修订号都是不透明值，调用方不得解析其字符串。
    P0 只有网页端，因此接口不包含 `platform`、`sourcePlatform` 或 `targetPlatform`。
    `channelId` 只用于区分链接分发来源，不得改变日期、档位、正文或图片。
servers:
  - url: /
    description: 与网页同源的后端
tags:
  - name: Public content
    description: 匿名用户读取已经发布的内容
  - name: Public sharing
    description: 海报、分享落地和反馈
  - name: Admin drafts
    description: 单一维护者编辑草稿并提交为不可变内容版本
  - name: Admin lifecycle
    description: 大师外部确认、检查、排期、发布、下线与恢复
  - name: Admin audit
    description: 单一维护者查看审计记录
security: []

paths:
  /api/v1/today:
    get:
      operationId: getToday
      tags: [Public content]
      summary: 获取服务端当前命理日的已发布内容
      description: |
        服务端按 `Asia/Shanghai` 一次性计算完整 `requestContext`。
        网页不得使用设备时钟重新计算 `civilDate`、`fortuneDate` 或 `shichen`。
      responses:
        "200":
          description: 当前命理日存在可以公开读取的内容
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Content-Version:
              $ref: "#/components/headers/XContentVersion"
            ETag:
              $ref: "#/components/headers/RepresentationETag"
            Cache-Control:
              $ref: "#/components/headers/DynamicCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayResponse"
              examples:
                woodDay:
                  $ref: "#/components/examples/TodaySuccess"
        "304":
          description: "`If-None-Match` 对应的完整响应表示仍有效"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            ETag:
              $ref: "#/components/headers/RepresentationETag"
            Cache-Control:
              $ref: "#/components/headers/DynamicCacheControl"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ContentNotReady"

  /api/v1/daily/{fortuneDate}:
    get:
      operationId: getDailyContent
      tags: [Public content]
      summary: 获取指定命理日当前安全的公开内容
      description: |
        用于分享落地页和既有日期链接，不表示产品提供历史浏览入口。
        如果调用方提供的预期版本已经被替换、回滚或下线，服务端返回当前安全版本，
        并在 `resolution` 中说明发生了版本变化。
      parameters:
        - $ref: "#/components/parameters/FortuneDate"
        - $ref: "#/components/parameters/ExpectedContentVersionOptional"
      responses:
        "200":
          description: 返回指定日期当前安全的公开内容
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Content-Version:
              $ref: "#/components/headers/XContentVersion"
            ETag:
              $ref: "#/components/headers/RepresentationETag"
            Cache-Control:
              $ref: "#/components/headers/DynamicCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyContentResponse"
              examples:
                current:
                  $ref: "#/components/examples/DailyCurrentSuccess"
                rolledBack:
                  $ref: "#/components/examples/DailyVersionChangedSuccess"
        "400":
          $ref: "#/components/responses/InvalidFortuneDate"
        "404":
          $ref: "#/components/responses/ContentNotFound"
        "410":
          $ref: "#/components/responses/HistoricalContentExpired"

  /api/v1/daily/{fortuneDate}/looks/{lookId}:
    get:
      operationId: getLookDetail
      tags: [Public content]
      summary: 获取指定内容版本中的穿搭详情
      parameters:
        - $ref: "#/components/parameters/FortuneDate"
        - $ref: "#/components/parameters/LookId"
        - $ref: "#/components/parameters/ExpectedContentVersionRequired"
      responses:
        "200":
          description: 返回与预期内容版本一致的穿搭详情
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Content-Version:
              $ref: "#/components/headers/XContentVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookDetailResponse"
              examples:
                commute:
                  $ref: "#/components/examples/LookDetailSuccess"
        "400":
          $ref: "#/components/responses/InvalidFortuneDate"
        "404":
          $ref: "#/components/responses/LookNotFound"
        "409":
          $ref: "#/components/responses/ContentVersionChanged"

  /api/v1/poster-jobs:
    post:
      operationId: createPosterJob
      tags: [Public sharing]
      summary: 获取已有海报或创建海报渲染任务
      description: |
        海报只使用已经发布的内容、已审核图片和已冻结模板，不调用 AI 生图。
        相同业务意图的网络重试必须复用同一个 `Idempotency-Key`。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePosterJobRequest"
            examples:
              organic:
                value:
                  fortuneDate: "2026-07-15"
                  expectedContentVersion: fd-20260715-r3
                  channelId: organic
      responses:
        "200":
          description: 已有相同海报实例
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosterJob"
        "202":
          description: 已接受新的渲染任务
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosterJob"
              examples:
                processing:
                  $ref: "#/components/examples/PosterJobProcessing"
        "409":
          description: 内容版本已变化或幂等键被用于另一请求
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/PosterUnavailable"

  /api/v1/poster-jobs/{jobId}:
    get:
      operationId: getPosterJob
      tags: [Public sharing]
      summary: 查询海报任务状态
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 返回当前任务状态
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosterJob"
              examples:
                ready:
                  $ref: "#/components/examples/PosterJobReady"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "503":
          $ref: "#/components/responses/PosterUnavailable"

  /api/v1/feedback-reports:
    post:
      operationId: createFeedbackReport
      tags: [Public sharing]
      summary: 提交内容纠错或产品建议
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackRequest"
            examples:
              contentError:
                value:
                  category: content_error
                  message: 图片主色与文字配方不一致
                  fortuneDate: "2026-07-15"
                  contentVersion: fd-20260715-r3
                  channelId: organic
                  contact: null
      responses:
        "202":
          description: 已接收反馈
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFeedbackResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/api/v1/daily-content-drafts:
    post:
      operationId: createDailyContentDraft
      tags: [Admin drafts]
      summary: 创建某个命理日的草稿
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftRequest"
            examples:
              empty:
                value:
                  fortuneDate: "2026-07-15"
                  copyFromContentVersion: null
      responses:
        "201":
          description: 已创建草稿
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            ETag:
              $ref: "#/components/headers/DraftETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDraft"
              examples:
                created:
                  $ref: "#/components/examples/DraftCreated"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/api/v1/daily-content-drafts/{draftId}:
    get:
      operationId: getDailyContentDraft
      tags: [Admin drafts]
      summary: 查看草稿
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: 返回草稿及当前修订号
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            ETag:
              $ref: "#/components/headers/DraftETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDraft"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"

  /admin/api/v1/daily-content-drafts/{draftId}/modules/{moduleCode}:
    patch:
      operationId: updateDailyContentDraftModule
      tags: [Admin drafts]
      summary: 修改草稿中的一个内容模块
      description: |
        只允许修改 `draft`。请求体必须与路径中的 `moduleCode` 对应。
        成功后服务端增加 `draftRevision` 并返回新的草稿 ETag。
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
        - $ref: "#/components/parameters/ModuleCode"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftModuleUpdate"
      responses:
        "200":
          description: 返回更新后的模块和草稿修订号
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            ETag:
              $ref: "#/components/headers/DraftETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedDraftModule"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/InvalidStateTransition"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /admin/api/v1/daily-content-drafts/{draftId}/submit:
    post:
      operationId: submitDailyContentDraft
      tags: [Admin drafts]
      summary: 冻结草稿并创建不可修改的内容版本
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: 已创建 `in_review` 内容版本
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            ETag:
              $ref: "#/components/headers/LifecycleETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitDraftResult"
              examples:
                submitted:
                  $ref: "#/components/examples/DraftSubmitted"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /admin/api/v1/daily-content-versions:
    get:
      operationId: listDailyContentVersions
      tags: [Admin lifecycle]
      summary: 查看某命理日的全部内容版本
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/FortuneDateQuery"
      responses:
        "200":
          description: 按创建时间倒序返回版本
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [fortuneDate, activeContentVersion, items]
                properties:
                  fortuneDate:
                    $ref: "#/components/schemas/FortuneDate"
                  activeContentVersion:
                    oneOf:
                      - $ref: "#/components/schemas/ContentVersion"
                      - type: "null"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContentVersionSummary"
        "400":
          $ref: "#/components/responses/InvalidFortuneDate"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /admin/api/v1/daily-content-versions/{contentVersion}:
    get:
      operationId: getDailyContentVersion
      tags: [Admin lifecycle]
      summary: 查看不可变内容、状态、检查和大师确认依据
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/ContentVersionPath"
      responses:
        "200":
          description: 返回一个完整内容版本
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            ETag:
              $ref: "#/components/headers/LifecycleETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContentVersion"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"

  /admin/api/v1/daily-content-versions/{contentVersion}/master-review-evidence:
    post:
      operationId: addMasterReviewEvidence
      tags: [Admin lifecycle]
      summary: 登记大师在系统外留下的确认依据
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/ContentVersionPath"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMasterReviewEvidenceRequest"
      responses:
        "200":
          description: 已登记依据并增加生命周期修订号
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            ETag:
              $ref: "#/components/headers/LifecycleETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContentVersion"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/InvalidStateTransition"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /admin/api/v1/daily-content-versions/{contentVersion}/review-decision:
    post:
      operationId: decideDailyContentReview
      tags: [Admin lifecycle]
      summary: 运行必审检查并批准或退回当前内容版本
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/ContentVersionPath"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          $ref: "#/components/responses/LifecycleActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/InvalidStateTransition"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "422":
          $ref: "#/components/responses/ReviewMissing"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /admin/api/v1/daily-content-versions/{contentVersion}/schedule:
    post:
      operationId: scheduleDailyContentVersion
      tags: [Admin lifecycle]
      summary: 安排内容版本在指定时间上线
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/ContentVersionPath"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
      responses:
        "200":
          $ref: "#/components/responses/LifecycleActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "422":
          $ref: "#/components/responses/PublishPrecheckFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /admin/api/v1/daily-content-versions/{contentVersion}/cancel-schedule:
    post:
      operationId: cancelDailyContentSchedule
      tags: [Admin lifecycle]
      summary: 取消未生效排期并回到 `approved`
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/ContentVersionPath"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpectedActiveVersionRequest"
      responses:
        "200":
          $ref: "#/components/responses/LifecycleActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /admin/api/v1/daily-content-versions/{contentVersion}/publish:
    post:
      operationId: publishDailyContentVersion
      tags: [Admin lifecycle]
      summary: 立即发布已批准的内容版本
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/ContentVersionPath"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpectedActiveVersionRequest"
      responses:
        "200":
          $ref: "#/components/responses/LifecycleActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "422":
          $ref: "#/components/responses/PublishPrecheckFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /admin/api/v1/daily-content-versions/{contentVersion}/withdraw:
    post:
      operationId: withdrawDailyContentVersion
      tags: [Admin lifecycle]
      summary: 下线当前版本并可同时恢复安全旧版本
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/ContentVersionPath"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawRequest"
      responses:
        "200":
          $ref: "#/components/responses/LifecycleActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "422":
          $ref: "#/components/responses/PublishPrecheckFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /admin/api/v1/daily-content-days/{fortuneDate}/rollback:
    post:
      operationId: rollbackDailyContentDay
      tags: [Admin lifecycle]
      summary: 恢复同一命理日曾经发布且仍安全的旧版本
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/FortuneDate"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRequest"
      responses:
        "200":
          $ref: "#/components/responses/LifecycleActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "422":
          $ref: "#/components/responses/PublishPrecheckFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /admin/api/v1/audit-events:
    get:
      operationId: listAuditEvents
      tags: [Admin audit]
      summary: 查询内容生命周期审计记录
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/FortuneDateQueryOptional"
        - name: contentVersion
          in: query
          schema:
            $ref: "#/components/schemas/ContentVersion"
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: 返回审计记录
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: five_admin_session
      description: |
        后台受同源安全会话保护。登录、二次确认、找回和紧急控制的具体接口由 Issue #31 冻结；
        本契约只固定后台业务接口必须经过身份验证。

  parameters:
    FortuneDate:
      name: fortuneDate
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FortuneDate"
    FortuneDateQuery:
      name: fortuneDate
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/FortuneDate"
    FortuneDateQueryOptional:
      name: fortuneDate
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/FortuneDate"
    LookId:
      name: lookId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ContentVersionPath:
      name: contentVersion
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ContentVersion"
    ModuleCode:
      name: moduleCode
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ModuleCode"
    ExpectedContentVersionOptional:
      name: expectedContentVersion
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ContentVersion"
    ExpectedContentVersionRequired:
      name: expectedContentVersion
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/ContentVersion"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        草稿写操作使用响应中的草稿 ETag；生命周期写操作使用内容版本 ETag。
        调用方必须原样回传，不能自行拼接。
      schema:
        type: string
        minLength: 3
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一业务意图的网络重试必须复用同一个高熵不透明值。
      schema:
        type: string
        minLength: 16
        maxLength: 128

  headers:
    XRequestId:
      description: 当前外部请求的追踪编号；缓存命中时也必须按请求生成。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    XContentVersion:
      description: 当前响应中的业务内容版本。
      schema:
        $ref: "#/components/schemas/ContentVersion"
    RepresentationETag:
      description: 完整 HTTP 响应表示的校验值，与 `contentVersion` 不是同一概念。
      schema:
        type: string
    DraftETag:
      description: 草稿当前修订号的强 ETag，例如 `"draft:7"`。
      schema:
        type: string
        example: '"draft:7"'
    LifecycleETag:
      description: 内容生命周期当前修订号的强 ETag，例如 `"lifecycle:12"`。
      schema:
        type: string
        example: '"lifecycle:12"'
    DynamicCacheControl:
      description: |
        `public, max-age=0, s-maxage=N, must-revalidate`。
        N 是 60 秒、内容结束、下一时辰和下一民用午夜剩余秒数中的最小值。
      schema:
        type: string
        example: public, max-age=0, s-maxage=42, must-revalidate

  schemas:
    FortuneDate:
      type: string
      format: date
      description: Five 命理日；北京时间 23:00 进入下一命理日。
      example: "2026-07-15"
    ZonedDateTime:
      type: string
      format: date-time
      example: "2026-07-14T23:30:00+08:00"
    ContentVersion:
      type: string
      minLength: 1
      maxLength: 128
      description: 不透明内容版本；调用方只能比较相等，不得解析。
      example: fd-20260715-r3
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 128
      description: 不透明标识；调用方不得解析。
    NullableContentVersion:
      oneOf:
        - $ref: "#/components/schemas/ContentVersion"
        - type: "null"
    ElementCode:
      type: string
      enum: [wood, fire, earth, metal, water]
    TierCode:
      type: string
      enum: [da_ji, ci_ji, ping, jiao_cha, bu_li]
    ContentState:
      type: string
      enum:
        - draft
        - in_review
        - changes_requested
        - approved
        - scheduled
        - published
        - superseded
        - withdrawn
    ModuleCode:
      type: string
      enum:
        - calendar_algorithm
        - copy_and_formula
        - visual_and_rights
        - poster_consistency
    RequestContext:
      type: object
      additionalProperties: false
      required:
        - responseGeneratedAt
        - civilDate
        - fortuneDate
        - shichen
        - timezone
        - dayBoundary
        - crossedDayBoundary
      properties:
        responseGeneratedAt:
          $ref: "#/components/schemas/ZonedDateTime"
        civilDate:
          type: string
          format: date
        fortuneDate:
          $ref: "#/components/schemas/FortuneDate"
        shichen:
          type: string
          enum: [子, 丑, 寅, 卯, 辰, 巳, 午, 未, 申, 酉, 戌, 亥]
        timezone:
          type: string
          const: Asia/Shanghai
        dayBoundary:
          type: string
          const: "23:00"
        crossedDayBoundary:
          type: boolean
    CalendarInfo:
      type: object
      additionalProperties: false
      required:
        - weekdayText
        - lunarDateText
        - ganzhiDay
        - branch
        - dayElement
        - dayElementLabel
      properties:
        weekdayText:
          type: string
          minLength: 1
          maxLength: 16
        lunarDateText:
          type: string
          minLength: 1
          maxLength: 32
        ganzhiDay:
          type: string
          minLength: 2
          maxLength: 8
        branch:
          type: string
          enum: [子, 丑, 寅, 卯, 辰, 巳, 午, 未, 申, 酉, 戌, 亥]
        dayElement:
          $ref: "#/components/schemas/ElementCode"
        dayElementLabel:
          type: string
          enum: [木, 火, 土, 金, 水]
    ColorRef:
      type: object
      additionalProperties: false
      required: [colorCode, name]
      properties:
        colorCode:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 32
    Tier:
      type: object
      additionalProperties: false
      required:
        - rank
        - tierCode
        - algorithmLabel
        - displayLabel
        - displaySection
        - element
        - elementLabel
        - colors
        - relationText
        - explanation
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 5
        tierCode:
          $ref: "#/components/schemas/TierCode"
        algorithmLabel:
          type: string
          enum: [大吉, 次吉, 平, 较差, 不利]
        displayLabel:
          type: string
          enum: [今日优先, 稳妥选择, 日常可穿, 注意]
        displaySection:
          type: string
          enum: [primary, attention]
          description: |
            大吉、次吉、平为 `primary`；较差和不利为 `attention`。
            网页按此字段合并展示，不自行重算五行关系。
        element:
          $ref: "#/components/schemas/ElementCode"
        elementLabel:
          type: string
          enum: [木, 火, 土, 金, 水]
        colors:
          type: array

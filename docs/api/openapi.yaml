  /admin/api/v1/daily-content-versions/{contentVersion}/cancel-schedule:
    post:
      operationId: cancelDailyContentSchedule
      tags: [Admin lifecycle]
      summary: 取消未生效排期并回到 `approved`
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/ContentVersionPath"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpectedActiveVersionRequest"
      responses:
        "200":
          $ref: "#/components/responses/LifecycleActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfValidationFailed"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /admin/api/v1/daily-content-versions/{contentVersion}/publish:
    post:
      operationId: publishDailyContentVersion
      tags: [Admin lifecycle]
      summary: 立即发布已批准的内容版本
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/ContentVersionPath"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpectedActiveVersionRequest"
      responses:
        "200":
          $ref: "#/components/responses/LifecycleActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfValidationFailed"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "422":
          $ref: "#/components/responses/PublishPrecheckFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /admin/api/v1/daily-content-versions/{contentVersion}/withdraw:
    post:
      operationId: withdrawDailyContentVersion
      tags: [Admin lifecycle]
      summary: 下线当前版本并可同时恢复安全旧版本
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/ContentVersionPath"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawRequest"
      responses:
        "200":
          $ref: "#/components/responses/LifecycleActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfValidationFailed"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "422":
          $ref: "#/components/responses/PublishPrecheckFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /admin/api/v1/daily-content-days/{fortuneDate}/rollback:
    post:
      operationId: rollbackDailyContentDay
      tags: [Admin lifecycle]
      summary: 恢复同一命理日曾经发布且仍安全的旧版本
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/FortuneDate"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRequest"
      responses:
        "200":
          $ref: "#/components/responses/LifecycleActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfValidationFailed"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "422":
          $ref: "#/components/responses/PublishPrecheckFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /admin/api/v1/audit-events:
    get:
      operationId: listAuditEvents
      tags: [Admin audit]
      summary: 查询内容生命周期审计记录
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/FortuneDateQueryOptional"
        - name: contentVersion
          in: query
          schema:
            $ref: "#/components/schemas/ContentVersion"
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: 返回审计记录
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: five_admin_session
      description: |
        Issue #31 已确认的同源安全会话。生产 Cookie 固定为 `HttpOnly`、`Secure`、
        `SameSite=Strict`、`Path=/admin` 且无 `Domain`；闲置 30 分钟、绝对 12 小时失效。
        所有后台写操作还必须校验可信同源 `Origin` 与会话绑定的 `X-CSRF-Token`。

  parameters:
    FortuneDate:
      name: fortuneDate
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FortuneDate"
    FortuneDateQuery:
      name: fortuneDate
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/FortuneDate"
    FortuneDateQueryOptional:
      name: fortuneDate
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/FortuneDate"
    LookId:
      name: lookId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ContentVersionPath:
      name: contentVersion
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ContentVersion"
    ModuleCode:
      name: moduleCode
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ModuleCode"
    ExpectedContentVersionOptional:
      name: expectedContentVersion
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ContentVersion"
    ExpectedContentVersionRequired:
      name: expectedContentVersion
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/ContentVersion"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        草稿写操作使用响应中的草稿 ETag；生命周期写操作使用内容版本 ETag；
        全局紧急控制使用公开内容开关 ETag。调用方必须原样回传，不能自行拼接。
      schema:
        type: string
        minLength: 3
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一业务意图的网络重试必须复用同一个高熵不透明值。
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[-A-Za-z0-9_:.]{16,128}$'
    XCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        当前后台会话绑定的随机 CSRF 令牌。后台写操作还必须由服务端校验可信同源 `Origin`；
        令牌只能保存在运行中页面内存，不能放入 localStorage、URL 或日志。
      schema:
        type: string
        minLength: 32
        maxLength: 256

  headers:
    XRequestId:
      description: 当前外部请求的追踪编号；缓存命中时也必须按请求生成。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    XContentVersion:
      description: 当前响应中的业务内容版本。
      schema:
        $ref: "#/components/schemas/ContentVersion"
    RepresentationETag:
      description: 完整 HTTP 响应表示的校验值，与 `contentVersion` 不是同一概念。
      schema:
        type: string
    DraftETag:
      description: 草稿当前修订号的强 ETag，例如 `"draft:7"`。
      schema:
        type: string
        example: '"draft:7"'
    LifecycleETag:
      description: 内容生命周期当前修订号的强 ETag，例如 `"lifecycle:12"`。
      schema:
        type: string
        example: '"lifecycle:12"'
    EmergencyControlETag:
      description: 全局公开内容开关当前修订号的强 ETag，例如 `"emergency-control:4"`。
      schema:
        type: string
        example: '"emergency-control:4"'
    NoStoreCacheControl:
      description: 认证、恢复、安全记录和紧急控制响应不得被浏览器或中间层保存。
      schema:
        type: string
        const: no-store
    AdminSessionSetCookie:
      description: |
        只包含随机会话令牌；生产环境固定使用 `HttpOnly; Secure; SameSite=Strict; Path=/admin`，
        不设置 `Domain`，闲置 30 分钟失效且绝对有效期不超过 12 小时。
      schema:
        type: string
    AdminSessionClearedCookie:
      description: 以相同 Cookie 属性和立即过期时间清除 `five_admin_session`。
      schema:
        type: string
    DynamicCacheControl:
      description: |
        `public, max-age=0, s-maxage=N, must-revalidate`。
        N 是 60 秒、内容结束、下一时辰和下一民用午夜剩余秒数中的最小值。
      schema:
        type: string
        example: public, max-age=0, s-maxage=42, must-revalidate

  schemas:
    FortuneDate:
      type: string
      format: date
      description: Five 命理日；北京时间 23:00 进入下一命理日。
      example: "2026-07-15"
    ZonedDateTime:
      type: string
      format: date-time
      example: "2026-07-14T23:30:00+08:00"
    ContentVersion:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^(?!\s)(?!.*\s$)[^\u0000-\u001F\u007F]+$'
      description: 不透明内容版本；禁止首尾空白及 C0/DEL 控制字符，调用方只能比较相等，不得解析。
      example: fd-20260715-r3
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 128
      description: 不透明标识；调用方不得解析。
    NullableContentVersion:
      oneOf:
        - $ref: "#/components/schemas/ContentVersion"
        - type: "null"
    ElementCode:
      type: string
      enum: [wood, fire, earth, metal, water]
    TierCode:
      type: string
      enum: [da_ji, ci_ji, ping, jiao_cha, bu_li]
    ContentState:
      type: string
      enum:
        - draft
        - in_review
        - changes_requested
        - approved
        - scheduled
        - published
        - superseded
        - withdrawn
    ModuleCode:
      type: string
      enum:
        - calendar_algorithm
        - copy_and_formula
        - visual_and_rights
        - poster_consistency
    AdminUsername:
      type: string
      minLength: 3
      maxLength: 64
      pattern: '^[a-z0-9][a-z0-9._-]{2,63}$'
      description: 由离线 bootstrap 命令首次创建的唯一小写 ASCII 维护者账号名；限流与校验使用同一规范值。
    AdminUsernameInput:
      type: string
      minLength: 3
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
      description: 登录或恢复输入；服务端在限流与凭据校验前执行 NFKC、去除首尾空白并转为规范小写账号名。
    AdminPassword:
      type: string
      minLength: 16
      maxLength: 128
      writeOnly: true
      description: 以 Unicode code point 计 16 至 128 位；只从请求正文或交互式 stdin 接收，禁止进入 CLI 参数、环境变量或日志。
    TotpCode:
      type: string
      pattern: '^\d{6}$'
      writeOnly: true
      description: 当前验证器生成的六位动态码；服务端必须原子拒绝已经接受过的 counter。
    AuthChallengeToken:
      type: string
      minLength: 32
      maxLength: 512
      description: 256-bit 随机一次性挑战原文；服务端只持久化域分离 HMAC 摘要。
    RecoveryCode:
      type: string
      minLength: 16
      maxLength: 128
      description: 高强度一次性恢复码原文；服务端只持久化域分离 HMAC 摘要。
    CreatePasswordChallengeRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/AdminUsernameInput"
        password:
          $ref: "#/components/schemas/AdminPassword"
    PasswordChallenge:
      type: object
      additionalProperties: false
      required: [challengeToken, expiresAt]
      properties:
        challengeToken:
          $ref: "#/components/schemas/AuthChallengeToken"
        expiresAt:
          $ref: "#/components/schemas/ZonedDateTime"
    CreateAdminSessionRequest:
      type: object
      additionalProperties: false
      required: [challengeToken, totpCode]
      properties:
        challengeToken:
          $ref: "#/components/schemas/AuthChallengeToken"
        totpCode:
          $ref: "#/components/schemas/TotpCode"
    AdminSession:
      type: object
      additionalProperties: false
      required:
        - username
        - issuedAt
        - idleExpiresAt
        - absoluteExpiresAt
        - csrfToken
        - credentialRevision
      properties:
        username:
          $ref: "#/components/schemas/AdminUsername"
        issuedAt:
          $ref: "#/components/schemas/ZonedDateTime"
        idleExpiresAt:
          $ref: "#/components/schemas/ZonedDateTime"
        absoluteExpiresAt:
          $ref: "#/components/schemas/ZonedDateTime"
        csrfToken:
          type: string
          minLength: 32
          maxLength: 256
          description: 会话绑定的随机令牌，只保存在运行中页面内存。
        credentialRevision:
          type: integer
          minimum: 1
    CreateRecoveryChallengeRequest:
      type: object
      additionalProperties: false
      required: [username, recoveryCode]
      properties:
        username:
          $ref: "#/components/schemas/AdminUsernameInput"
        recoveryCode:
          $ref: "#/components/schemas/RecoveryCode"
    TotpProvisioning:
      type: object
      additionalProperties: false
      required: [secret, otpauthUri, algorithm, digits, periodSeconds]
      properties:
        secret:
          type: string
          minLength: 32
          maxLength: 128
          pattern: '^[A-Z2-7]+=*$'
          description: 待启用的 TOTP Base32 密钥，只在本次 no-store 恢复挑战响应中返回。
        otpauthUri:
          type: string
          format: uri
          maxLength: 2048
          description: 与 `secret` 相同的待启用配置，只用于验证器录入，禁止记录日志。
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        periodSeconds:
          type: integer
          const: 30
    RecoveryChallenge:
      type: object
      additionalProperties: false
      required: [challengeToken, expiresAt, totpProvisioning]
      properties:
        challengeToken:
          $ref: "#/components/schemas/AuthChallengeToken"
        expiresAt:
          $ref: "#/components/schemas/ZonedDateTime"
        totpProvisioning:
          $ref: "#/components/schemas/TotpProvisioning"
    CompleteRecoveryRequest:
      type: object
      additionalProperties: false
      required: [challengeToken, newPassword, totpCode]
      properties:
        challengeToken:
          $ref: "#/components/schemas/AuthChallengeToken"
        newPassword:
          $ref: "#/components/schemas/AdminPassword"
        totpCode:
          $ref: "#/components/schemas/TotpCode"
    RecoveryCompletion:
      type: object
      additionalProperties: false
      required: [session, recoveryCodes]
      properties:
        session:
          $ref: "#/components/schemas/AdminSession"
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          description: 新的一套十个一次性恢复码；只在本次 no-store 响应显示。
          items:
            $ref: "#/components/schemas/RecoveryCode"
    SecurityEventAction:
      type: string
      enum:
        - bootstrap_completed
        - login_password
        - login_totp
        - logout_current
        - logout_all
        - recovery_code
        - recovery_completed
        - offline_reset
        - csrf_rejected
        - rate_limited
        - emergency_stop
        - emergency_resume
    SecurityEventOutcome:
      type: string
      enum: [succeeded, rejected]
    SecurityEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - occurredAt
        - action
        - outcome
        - requestId
        - sourceFingerprint
        - clientSummary
        - reason
      properties:
        eventId:
          $ref: "#/components/schemas/OpaqueId"
        occurredAt:
          $ref: "#/components/schemas/ZonedDateTime"
        action:
          $ref: "#/components/schemas/SecurityEventAction"
        outcome:
          $ref: "#/components/schemas/SecurityEventOutcome"
        requestId:
          type: string
          minLength: 8
          maxLength: 128
        sourceFingerprint:
          type: string
          minLength: 16
          maxLength: 128
          description: 使用部署密钥生成的单向来源指纹，不是 IP 或可逆地址。
        clientSummary:
          oneOf:
            - type: string
              maxLength: 160
            - type: "null"
          description: 经过截断和字段白名单处理的浏览器摘要，不保存完整 User-Agent。
        reason:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 2000
            - type: "null"
          description: 仅返回紧急控制或离线重置等动作明确记录的审计原因；认证凭据和内部异常不得写入此字段。
    SecurityEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SecurityEvent"
        nextCursor:
          oneOf:
            - type: string
              maxLength: 256
            - type: "null"
    EmergencyControlStatus:
      type: object
      additionalProperties: false
      required:
        - publicAccessEnabled
        - revision
        - changedAt
        - reason
        - auditEventId
      properties:
        publicAccessEnabled:
          type: boolean
        revision:
          type: integer
          minimum: 1
        changedAt:
          $ref: "#/components/schemas/ZonedDateTime"
        reason:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 2000
            - type: "null"
        auditEventId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
    EmergencyStopRequest:
      type: object
      additionalProperties: false
      required: [totpCode, confirmationPhrase, reason]
      properties:
        totpCode:
          $ref: "#/components/schemas/TotpCode"
        confirmationPhrase:
          type: string
          const: 停止全部公开内容
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    EmergencyResumeRequest:
      type: object
      additionalProperties: false
      required: [totpCode, confirmationPhrase, reason]
      properties:
        totpCode:
          $ref: "#/components/schemas/TotpCode"
        confirmationPhrase:
          type: string
          const: 恢复全部公开内容
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    RequestContext:
      type: object
      additionalProperties: false
      required:
        - responseGeneratedAt
        - civilDate
        - fortuneDate
        - shichen
        - timezone
        - dayBoundary
        - crossedDayBoundary
      properties:
        responseGeneratedAt:
          $ref: "#/components/schemas/ZonedDateTime"
        civilDate:
          type: string
          format: date
        fortuneDate:
          $ref: "#/components/schemas/FortuneDate"
        shichen:
          type: string
          enum: [子, 丑, 寅, 卯, 辰, 巳, 午, 未, 申, 酉, 戌, 亥]
        timezone:
          type: string
          const: Asia/Shanghai
        dayBoundary:
          type: string
          const: "23:00"
        crossedDayBoundary:
          type: boolean
    CalendarInfo:
      type: object
      additionalProperties: false
      required:
        - weekdayText
        - lunarDateText
        - ganzhiDay
        - branch
        - dayElement
        - dayElementLabel
      properties:
        weekdayText:
          type: string
          minLength: 1
          maxLength: 16
        lunarDateText:
          type: string
          minLength: 1
          maxLength: 32
        ganzhiDay:
          type: string
          minLength: 2
          maxLength: 8
        branch:
          type: string
          enum: [子, 丑, 寅, 卯, 辰, 巳, 午, 未, 申, 酉, 戌, 亥]
        dayElement:
          $ref: "#/components/schemas/ElementCode"
        dayElementLabel:
          type: string
          enum: [木, 火, 土, 金, 水]
    ColorRef:
      type: object
      additionalProperties: false
      required: [colorCode, name]
      properties:
        colorCode:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 32
    Tier:
      type: object
      additionalProperties: false
      required:
        - rank
        - tierCode
        - algorithmLabel
        - displayLabel
        - displaySection
        - element
        - elementLabel
        - colors
        - relationText
        - explanation
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 5
        tierCode:
          $ref: "#/components/schemas/TierCode"
        algorithmLabel:
          type: string
          enum: [大吉, 次吉, 平, 较差, 不利]
        displayLabel:
          type: string
          enum: [今日优先, 稳妥选择, 日常可穿, 注意]
        displaySection:
          type: string
          enum: [primary, attention]
          description: |
            大吉、次吉、平为 `primary`；较差和不利为 `attention`。
            网页按此字段合并展示，不自行重算五行关系。
        element:
          $ref: "#/components/schemas/ElementCode"
        elementLabel:
          type: string
          enum: [木, 火, 土, 金, 水]
        colors:
          type: array
          minItems: 1
          maxItems: 12
